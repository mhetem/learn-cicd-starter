name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build container
        run: ./scripts/buildprod.sh

      - name: Set up Google Cloud
        uses: 'google-github-actions/setup-gcloud@v3.0.0'
        with:
          project_id: notely-504219

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1.0.0'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS}}
      
      - name: build and push container to GCP Artifact Registry
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-504219/notely-ar-repo/notely:latest

      - name: Run migrations
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-504219/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-504219 --max-instances=4